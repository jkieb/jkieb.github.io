name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tuftelei/package-lock.json
      - name: Build Tuftelei
        working-directory: tuftelei
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='tuftelei' --exclude='_site' \
            --exclude='Screenshot *.png' --exclude='README.md' \
            ./ _site/
          mkdir -p _site/tuftelei
          cp -r tuftelei/dist/. _site/tuftelei/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
